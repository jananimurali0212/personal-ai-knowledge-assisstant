# ==============================================================================
# Render Blueprint Specification (render.yaml)
# Personal AI Knowledge Assistant - Production Deployment
# ==============================================================================
services:
  - type: web
    name: personal-ai-knowledge-assistant-backend
    env: python
    region: oregon # or frankfurt, singapore, ohio
    plan: starter
    branch: main
    buildCommand: "pip install --upgrade pip && pip install -r backend/requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_EMBEDDING_MODEL
        value: models/text-embedding-004
      - key: GEMINI_EMBEDDING_DIMENSIONS
        value: 768
      - key: GEMINI_GENERATION_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_GENERATION_TEMPERATURE
        value: 0.2
      - key: GEMINI_GENERATION_MAX_TOKENS
        value: 1024
      - key: RERANKING_ENABLED
        value: "true"
      - key: CORS_ORIGINS
        value: "https://your-frontend.vercel.app,http://localhost:5173"
